version: "3.9"

# ============================================================
# Lucifer AI — Development Docker Compose Stack
# Usage: docker compose -f infra/docker-compose.yml up -d
# ============================================================

x-restart: &restart
  restart: unless-stopped

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:

  # ── PostgreSQL 16 + pgvector + TimescaleDB ────────────────
  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    container_name: lucifer-postgres
    <<: *restart
    environment:
      POSTGRES_DB: lucifer
      POSTGRES_USER: lucifer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: schema is applied via Alembic (`make migrate`), not the initdb
      # auto-mount, so migrations have a single source of truth. See README §3.
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U lucifer -d lucifer"]

  # ── Neo4j 5 Community ─────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: lucifer-neo4j
    <<: *restart
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # HTTP / Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "neo4j", "status"]

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lucifer-redis
    <<: *restart
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  # ── NATS JetStream ────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: lucifer-nats
    <<: *restart
    command: >
      -js
      -sd /data
      -m 8222
      --name lucifer-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]

  # ── MinIO (S3-compatible Artifact Store) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: lucifer-minio
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]

  # ── MinIO Bucket Init (one-shot) ──────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: lucifer-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin ${MINIO_SECRET_KEY:-changeme};
        mc mb --ignore-existing local/lucifer-artifacts;
        mc anonymous set none local/lucifer-artifacts;
        echo 'MinIO bucket ready.';
      "

  # ── LiteLLM Proxy ─────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: lucifer-litellm
    <<: *restart
    command: --config /app/config.yaml --port 8080 --num_workers 4
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GOOGLE_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]

  # ── Mem0 (Self-hosted) ────────────────────────────────────
  mem0:
    image: mem0ai/mem0:latest
    container_name: lucifer-mem0
    <<: *restart
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEM0_API_KEY: ${MEM0_API_KEY:-local-dev-key}
    ports:
      - "8090:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]

  # ── Zep (Temporal Knowledge Graph) ───────────────────────
  zep:
    image: ghcr.io/getzep/zep:latest
    container_name: lucifer-zep
    <<: *restart
    environment:
      ZEP_STORE_TYPE: postgres
      ZEP_STORE_POSTGRES_DSN: "postgres://lucifer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/lucifer"
      ZEP_AUTH_SECRET: ${ZEP_API_KEY:-local-dev-zep-key}
      ZEP_AUTH_REQUIRED: "false"          # Enable in production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8091:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz || exit 1"]

  # ── OpenTelemetry Collector ───────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: lucifer-otel-collector
    <<: *restart
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    depends_on:
      - prometheus
      - loki
      - jaeger

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: lucifer-prometheus
    <<: *restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: lucifer-grafana
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]

  # ── Loki (Log Aggregation) ────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: lucifer-loki
    <<: *restart
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # ── Jaeger (Distributed Tracing) ─────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: lucifer-jaeger
    <<: *restart
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14317:4317"   # OTLP gRPC (internal use by collector)
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686 || exit 1"]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  nats_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: lucifer-network
