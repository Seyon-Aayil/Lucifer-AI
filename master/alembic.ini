# =============================================================================
# Lucifer AI — Alembic configuration
# The database URL is NOT set here; it is injected at runtime from
# master.core.config.get_settings().database_url (see alembic/env.py).
# Run from the master/ directory:  python -m alembic upgrade head
# =============================================================================
[alembic]
script_location = alembic
prepend_sys_path = ..
# Use a path separator that works cross-platform for version locations.
path_separator = os
# Timestamped, slugged revision filenames: 0002_add_widget_table.py style.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
