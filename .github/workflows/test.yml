name: CI — Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests (no external services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest master/tests/unit/ -v -m "not integration" --cov=master --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  integration-tests:
    name: Integration Tests (with Docker services)
    runs-on: ubuntu-latest
    services:
      postgres:
        # -ha image bundles pgvector + timescaledb (the plain image lacks pgvector)
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: lucifer
          POSTGRES_USER: lucifer
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "neo4j status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://lucifer:testpassword@localhost:5432/lucifer
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      APP_ENV: test
      # Settings.app_secret_key requires min_length=32.
      APP_SECRET_KEY: ci-integration-secret-key-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The full .[dev] install pulls torch + nvidia CUDA wheels (~5GB) and
          # the timescaledb-ha image is large; the default runner runs out of
          # disk. Reclaim ~25GB of preinstalled toolchains we don't use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Postgres migrations
        run: |
          pip install psycopg2-binary
          python -c "
          import psycopg2, os
          conn = psycopg2.connect('postgresql://lucifer:testpassword@localhost:5432/lucifer')
          cur = conn.cursor()
          with open('infra/postgres/migrations/0001_initial_schema.sql') as f:
              cur.execute(f.read())
          conn.commit()
          "

      - name: Run integration tests
        run: |
          # Clear the repo-wide coverage gate (addopts) — it's meaningful for the
          # unit suite, not this DB-bootstrap job. Tolerate exit code 5 (no tests
          # collected) so the empty integration suite doesn't fail the build.
          pytest master/tests/integration/ -v -m "integration" --override-ini="addopts=" || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo "No integration tests collected yet — DB bootstrap validated, skipping."
            exit 0
          fi
          exit "${code:-0}"
