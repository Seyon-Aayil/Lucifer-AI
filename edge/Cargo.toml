[workspace]
resolver = "2"
members = ["sync-client", "desktop-bindings", "edge-store", "offline-queue", "ollama-sidecar", "edge-cli", "desktop", "mlx-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88 is the floor: the tauri 2.x transitive graph (image, plist, time,
# serde_with, icu_*) plus toml_parser's edition2024 feature collectively
# require rustc 1.88.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ramsanjiev/Lucifer"

[workspace.dependencies]
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tokio-stream = "0.1"
futures = "0.3"
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = { version = "2", features = [] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "blob", "load_extension"] }
sqlite-vec = "0.1"
zerocopy = { version = "0.7", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
keyring = "3"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
