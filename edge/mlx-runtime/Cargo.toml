[package]
name = "lucifer-mlx-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apple-Silicon MLX inference backend for the Lucifer edge clients with an Ollama fallback for non-Apple-Silicon hosts."

[features]
# `mlx` enables the real MLX implementation. Requires `cmake` on $PATH and
# Apple Silicon hardware. Off by default so non-Apple-Silicon checkouts (and
# CI runners without cmake) keep building.
default = []
mlx = ["dep:mlx-rs", "dep:tokenizers", "dep:safetensors", "dep:tokio-stream"]
# `llama` scaffolds the cross-platform llama.cpp backend (Phase 4c mobile engine).
# The seam compiles pure-Rust today; the `llama-cpp-2` token loop is wired in the
# Phase 4c device spike (Gate 3). Off by default.
llama = []

[dependencies]
lucifer-ollama-sidecar = { path = "../ollama-sidecar" }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

mlx-rs = { version = "0.25", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
safetensors = { version = "0.7", optional = true }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
