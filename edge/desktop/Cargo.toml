[package]
name = "lucifer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lucifer Tauri 2.0 desktop application (macOS first)."

[[bin]]
name = "lucifer-desktop"
path = "src/main.rs"

[dependencies]
lucifer-desktop-bindings = { path = "../desktop-bindings" }
lucifer-sync-client      = { path = "../sync-client" }

tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
