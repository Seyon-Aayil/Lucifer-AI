[package]
name = "lucifer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lucifer Tauri 2.0 application (desktop + mobile entry)."

# Tauri mobile drives the app through this library (`run()` is the
# `mobile_entry_point`); the desktop binary below is a thin wrapper around it.
[lib]
name = "lucifer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lucifer-desktop"
path = "src/main.rs"

[dependencies]
lucifer-desktop-bindings = { path = "../desktop-bindings" }
lucifer-sync-client      = { path = "../sync-client" }
lucifer-mlx-runtime      = { path = "../mlx-runtime" }

tauri = { workspace = true, features = ["macos-private-api", "image-png"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Desktop-only chrome: tray icon + global hotkey have no mobile equivalent.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[build-dependencies]
tauri-build = { workspace = true }
